name: Documentation CI

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.mdx"
      - "**/*.yaml"
      - "examples/**"
      - package.json
      - package-lock.json
      - tsconfig.examples.json
      - docs.json
      - .github/workflows/docs-ci.yml
  push:
    branches: [main]
    paths:
      - "**/*.mdx"
      - "**/*.yaml"
      - "examples/**"
      - package.json
      - package-lock.json
      - tsconfig.examples.json
      - docs.json
      - .github/workflows/docs-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate navigation JSON
        run: jq empty docs.json

      - name: Reject third-party product names
        run: |
          forbidden='([lL][aA][gG][oO]|[aA][uU][tT][uU][mM][nN])'
          if git ls-files | grep -Eiq "$forbidden"; then
            echo "A published file name contains a forbidden third-party product name." >&2
            git ls-files | grep -Ei "$forbidden" >&2
            exit 1
          fi
          if git grep -niE "$forbidden" -- . ':(exclude)nozle-openapi.yaml'; then
            echo "Published documentation contains a forbidden third-party product name." >&2
            exit 1
          fi
          # The public Core contract still emits inherited compatibility field
          # names and webhook headers. Permit only those exact wire identifiers;
          # reject the third-party product name everywhere else in the spec.
          sed -E \
            -e 's/[lL][aA][gG][oO]_[A-Za-z0-9_]+//g' \
            -e 's/X-[lL][aA][gG][oO]-[A-Za-z-]+//g' \
            nozle-openapi.yaml > /tmp/nozle-openapi-brand-check.yaml
          if grep -niE "$forbidden" /tmp/nozle-openapi-brand-check.yaml; then
            echo "The OpenAPI specification contains third-party branding outside compatibility wire names." >&2
            exit 1
          fi

      - name: Check internal links
        run: npx --yes mintlify@4.2.715 broken-links

      - name: Compile integration examples
        run: |
          npm ci --ignore-scripts
          npm run typecheck:examples
          python -m py_compile examples/python-sdk.py
